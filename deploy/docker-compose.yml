services:
  mysql:
    image: mysql:8.4
    container_name: agent-runtime-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agent_runtime
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent
    ports: ["3308:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]

  redis:
    image: redis:7
    container_name: agent-runtime-redis
    ports: ["6380:6379"]
    volumes: ["redis_data:/data"]

  namesrv:
    image: apache/rocketmq:5.3.3
    container_name: agent-runtime-namesrv
    command: sh mqnamesrv
    ports: ["9876:9876"]

  broker:
    image: apache/rocketmq:5.3.3
    container_name: agent-runtime-broker
    depends_on: [namesrv]
    environment:
      NAMESRV_ADDR: namesrv:9876
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/rocketmq-5.3.3/conf/broker.conf
    ports: ["10909:10909", "10911:10911"]

  # 长期记忆的向量索引存储。仅承载派生数据（权威内容在 MySQL 的 agent_node.output），
  # 因此清空 qdrant_data 卷 + memory_indexed 表即可触发全量重建，不存在数据丢失风险。
  #
  # 版本说明：服务端用 v1.19.1（qdrant/qdrant 的发布版本），
  # 与 go.mod 中的客户端 github.com/qdrant/go-client v1.19.2 属于同一 1.19.x 兼容线——
  # 两者的补丁号**并不同步**，不要照抄客户端版本号，否则镜像拉取会失败。
  #
  # 端口约定：6333 是 REST/Web UI（浏览器打开 http://localhost:6333/dashboard 可查看集合），
  # 6334 是 gRPC——Go 客户端走的是 gRPC，QDRANT_PORT 必须填 6334，
  # 填成 6333 会得到难以理解的连接错误。
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: agent-runtime-qdrant
    environment:
      # 显式绑定 gRPC 端口，避免依赖镜像默认值随版本变化。
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  # ===== 可观测性栈（P0）=====
  # 启动顺序：otel-collector 依赖 tempo/prometheus/loki，grafana 依赖全部后端。
  # 各 agent-runtime 进程需设置 OTEL_EXPORTER_OTLP_ENDPOINT=localhost:4317
  # 才能把数据发往 Collector（未设置时降级为 stdout，不影响本地开发）。

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: agent-runtime-otel-collector
    depends_on: [tempo, loki]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics endpoint
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  tempo:
    image: grafana/tempo:2.6.0
    container_name: agent-runtime-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # HTTP 查询
      - "4317"        # OTLP gRPC（仅内部，collector 写入）

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agent-runtime-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.2.0
    container_name: agent-runtime-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: agent-runtime-grafana
    depends_on: [tempo, prometheus, loki]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  tempo_data:
  prometheus_data:
  loki_data:
  grafana_data:
