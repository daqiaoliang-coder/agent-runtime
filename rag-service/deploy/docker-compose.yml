# 本地开发环境：Qdrant + rag-api（+ 可选 TEI 重排器）。
# embedding 网关是外部设施（OpenAI 兼容即可），不在本 compose 内；
# 下例指向宿主机的 ollama，换成真实网关地址即可。
#
# 重排器（可选）：docker compose --profile rerank up
# 首次启动会下载 bge-reranker-v2-m3（约 2GB），CPU 推理单批几十毫秒，
# 本地验证够用；生产建议 GPU 镜像与独立部署。
services:
  qdrant:
    image: qdrant/qdrant:latest # 生产环境请固定版本
    ports:
      - "6333:6333" # REST / Web UI
      - "6334:6334" # gRPC（rag-api 使用这个端口）
    volumes:
      - qdrant-data:/qdrant/storage

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu
    profiles: ["rerank"]
    ports:
      - "8090:8090"
    environment:
      # bge-reranker-v2-m3 是 cross-encoder：加载后 /rerank 端点可用。
      MODEL_ID: BAAI/bge-reranker-v2-m3
      PORT: "8090"
    volumes:
      # 模型缓存卷避免每次重建容器都重新下载。
      - tei-models:/data

  rag-api:
    build: ..
    ports:
      - "8080:8080"
    environment:
      RAG_ADDR: ":8080"
      RAG_API_TOKEN: "" # 本地不鉴权；生产必须设置
      RAG_QDRANT_HOST: qdrant
      RAG_QDRANT_PORT: "6334"
      RAG_COLLECTION: agent_memory # 直接读 runtime 索引器投影的现有集合
      RAG_DOCS_COLLECTION: rag_documents
      RAG_EMBED_BASE_URL: http://host.docker.internal:11434/v1
      RAG_EMBED_MODEL: bge-m3
      RAG_BUDGET_MS: "400"
      RAG_TOPK: "10"
      RAG_MIN_SCORE: "0.7"
      # Phase 3：docs profile（缺省值即下方注释，显式声明便于对照）。
      RAG_DOCS_BUDGET_MS: "1500"
      RAG_DOCS_OVERFETCH: "4"
      RAG_CHUNK_PARENT_SIZE: "1200"
      RAG_CHUNK_CHILD_SIZE: "400"
      RAG_MAX_CHUNKS_PER_REQUEST: "256"
      # 重排：仅在 docker compose --profile rerank up 时取消注释
      # （nil=关闭；误配置会让每次 docs 检索空等 500ms 超时后才降级）。
      # RAG_RERANK_BASE_URL: http://tei-reranker:8090
      RAG_RERANK_TIMEOUT_MS: "500"
      # 上下文增强（可选；开启时必须配置 LLM 网关）。
      RAG_CONTEXTUAL_ENABLED: "false"
      # RAG_CONTEXTUAL_BASE_URL: http://host.docker.internal:11434/v1
      # RAG_CONTEXTUAL_MODEL: qwen2.5:7b
      # RAG_CONTEXTUAL_CONCURRENCY: "4"
    depends_on:
      - qdrant

volumes:
  qdrant-data:
  tei-models:
